<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>割り勘計算機</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    box-sizing: border-box;
}

button {
    cursor: pointer;
}

.result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}

.checkbox {
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">
    <h1>割り勘計算機</h1>

    <label>合計金額（円）</label>
    <input type="number" id="total" placeholder="5000">

    <label>人数</label>
    <input type="number" id="people" placeholder="4">

    <div class="checkbox">
        <input type="checkbox" id="freeHost" style="width:auto;">
        <label for="freeHost">幹事を無料にする</label>
    </div>

    <button onclick="calculate()">計算する</button>

    <div class="result" id="result"></div>
</div>

<script>
function calculate() {

    const total = Number(document.getElementById("total").value);
    const people = Number(document.getElementById("people").value);
    const freeHost = document.getElementById("freeHost").checked;

    if (total <= 0 || people <= 0) {
        document.getElementById("result").innerHTML =
            "正しい数値を入力してください";
        return;
    }

    let payPeople = people;

    // 幹事無料の場合
    if (freeHost) {

        if (people <= 1) {
            document.getElementById("result").innerHTML =
                "2人以上必要です";
            return;
        }

        payPeople = people - 1;
    }

    const amount = Math.ceil(total / payPeople);

    document.getElementById("result").innerHTML =
        `支払う人：${payPeople}人<br>
         1人あたり：${amount.toLocaleString()}円`;
}
</script>

</body>
</html>
