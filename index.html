<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>割り勘計算機</title>

    <style>
        /* ページ全体のデザイン */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* 計算機の枠 */
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>割り勘計算機</h1>

    <!-- 合計金額入力 -->
    <label for="total">合計金額（円）</label>
    <input type="number" id="total" placeholder="例: 5000">

    <!-- 人数入力 -->
    <label for="people">人数</label>
    <input type="number" id="people" placeholder="例: 4">

    <!-- 計算ボタン -->
    <button onclick="calculate()">計算する</button>

    <!-- 結果表示エリア -->
    <div id="result"></div>
</div>

<script>
    // 割り勘計算を行う関数
    function calculate() {

        // 入力された値を取得
        const total = Number(document.getElementById("total").value);
        const people = Number(document.getElementById("people").value);

        // 入力チェック
        if (total <= 0 || people <= 0) {
            document.getElementById("result").textContent =
                "正しい数値を入力してください";
            return;
        }

        // 一人あたりの金額を計算
        const perPerson = Math.ceil(total / people);

        // 結果を表示
        document.getElementById("result").textContent =
            `一人あたり ${perPerson.toLocaleString()} 円`;
    }
</script>

</body>
</html>
